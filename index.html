<style>
  :root {
    --cream: #FBF7F0;
    --cream-deep: #F4EEE2;
    --surface: #FFFEFB;
    --terracotta: #C4623B;
    --terracotta-deep: #A04E2C;
    --brown: #3D2817;
    --brown-soft: #5C4631;
    --muted: #8A7659;
    --border: #E8DFD0;
    --border-soft: #F1E9DA;
    --sage: #7BA85C;
    --sage-soft: #C8DBB8;
    --amber: #E89B3C;
    --amber-soft: #F8DEB6;
    --rose: #B8554A;
    --rose-soft: #EBC4BC;
    --shadow-sm: 0 1px 2px rgba(61, 40, 23, 0.04), 0 1px 3px rgba(61, 40, 23, 0.06);
    --shadow-md: 0 4px 12px rgba(61, 40, 23, 0.06), 0 2px 4px rgba(61, 40, 23, 0.04);
    --shadow-lg: 0 12px 28px rgba(61, 40, 23, 0.08), 0 4px 8px rgba(61, 40, 23, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream);
    color: var(--brown);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    overflow-x: hidden;
  }

  #root { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* ==== Header ==== */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    padding: env(safe-area-inset-top) 0 0 0;
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: rgba(255, 254, 251, 0.92);
  }
  .app-header-inner {
    max-width: 720px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    gap: 12px;
  }
  @media (max-width: 540px) {
    .app-header-inner {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px 16px;
    }
    .tabs { width: 100%; }
    .tab { padding: 7px 8px; font-size: 12px; }
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--terracotta);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(196, 98, 59, 0.3);
  }
  .brand-name {
    font-family: 'Fraunces', serif;
    font-weight: 600; font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--brown);
  }
  .brand-tag {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.04em; text-transform: uppercase;
    font-weight: 500; margin-top: -2px;
  }

  /* ==== Tab nav ==== */
  .tabs {
    display: flex; gap: 2px;
    background: var(--cream-deep);
    padding: 4px; border-radius: 12px;
  }
  .tab {
    flex: 1; padding: 8px 14px;
    border: none; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer; border-radius: 9px;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .tab:hover { color: var(--brown-soft); }
  .tab.active {
    background: var(--surface);
    color: var(--brown);
    box-shadow: var(--shadow-sm);
  }

  /* ==== Main ==== */
  main {
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px calc(80px + env(safe-area-inset-bottom));
  }

  /* ==== Headings ==== */
  h1, h2, h3, h4 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--brown);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  h2 { font-size: 22px; margin-bottom: 16px; }
  h3 { font-size: 17px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  /* ==== Cards ==== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
  }
  .card-hero {
    background: linear-gradient(135deg, var(--cream-deep) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .card-hero::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(196, 98, 59, 0.07), transparent 70%);
  }

  /* ==== Status badges ==== */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  }
  .badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .badge.sage { background: var(--sage-soft); color: #4A6B33; }
  .badge.amber { background: var(--amber-soft); color: #8C5A1F; }
  .badge.rose { background: var(--rose-soft); color: #8A3329; }
  .badge.brown { background: var(--cream-deep); color: var(--brown-soft); }
  .badge.terracotta { background: rgba(196, 98, 59, 0.14); color: var(--terracotta-deep); }
  .badge.ice { background: #D5E2F0; color: #3A5572; }

  /* ==== Buttons ==== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 18px; border-radius: 10px;
    border: 1px solid transparent;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.15s ease;
    background: var(--cream-deep); color: var(--brown-soft);
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: var(--border); }
  .btn-primary {
    background: var(--terracotta); color: var(--surface);
    box-shadow: 0 2px 4px rgba(196, 98, 59, 0.25);
  }
  .btn-primary:hover { background: var(--terracotta-deep); }
  .btn-ghost { background: transparent; color: var(--muted); padding: 8px 12px; }
  .btn-ghost:hover { background: var(--cream-deep); color: var(--brown-soft); }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  .btn-block { width: 100%; }
  .btn-danger-ghost { background: transparent; color: var(--rose); }
  .btn-danger-ghost:hover { background: var(--rose-soft); }

  /* ==== Inputs ==== */
  .field { margin-bottom: 14px; }
  .field-label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--brown-soft); margin-bottom: 6px;
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .input, .select, .textarea {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-family: inherit; font-size: 15px; color: var(--brown);
    transition: all 0.15s ease;
  }
  .input:focus, .select:focus, .textarea:focus {
    outline: none; border-color: var(--terracotta);
    box-shadow: 0 0 0 3px rgba(196, 98, 59, 0.12);
  }
  .textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .input-suffix-wrap { position: relative; }
  .input-suffix {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--muted); pointer-events: none; font-weight: 500;
  }
  .input-suffix-wrap .input { padding-right: 40px; }

  /* ==== Starter status ==== */
  .starter-hero {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .starter-name {
    font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600;
    color: var(--brown);
  }
  .starter-meta {
    font-size: 13px; color: var(--muted); margin-top: 2px;
  }
  .starter-stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-top: 18px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px;
  }
  .stat-label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600;
    color: var(--brown); letter-spacing: -0.02em;
  }
  .stat-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ==== Rise progress bar ==== */
  .rise-track {
    height: 8px; background: var(--cream-deep);
    border-radius: 999px; overflow: hidden;
    margin-top: 14px; position: relative;
  }
  .rise-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--amber), var(--sage));
    transition: width 1s ease;
  }
  .rise-marks {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
    margin-top: 6px; font-weight: 500;
  }

  /* ==== Feeding row ==== */
  .feeding-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .feeding-row:last-child { border-bottom: none; }
  .feeding-when {
    font-size: 14px; font-weight: 500; color: var(--brown);
  }
  .feeding-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .feeding-ratio {
    font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600;
    color: var(--terracotta);
  }

  /* ==== Recipe cards ==== */
  .recipe-grid { display: grid; gap: 12px; }
  .recipe-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .recipe-card:hover {
    border-color: var(--terracotta);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .recipe-card-title {
    font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600;
    color: var(--brown);
  }
  .recipe-card-meta {
    font-size: 12px; color: var(--muted); margin-top: 3px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .recipe-card.selected {
    border-color: var(--terracotta);
    background: linear-gradient(135deg, rgba(196,98,59,0.07), var(--surface));
    box-shadow: 0 2px 6px rgba(196, 98, 59, 0.15);
  }
  .recipe-checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    color: white;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .recipe-checkbox.checked {
    background: var(--terracotta);
    border-color: var(--terracotta);
  }
  .btn-danger {
    background: var(--rose); color: white;
    box-shadow: 0 2px 4px rgba(184, 85, 74, 0.25);
  }
  .btn-danger:hover { background: #9C4339; }
  .recipe-card-meta span {
    display: inline-flex; align-items: center; gap: 4px;
  }

  /* ==== Empty state ==== */
  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--muted);
  }
  .empty-mark {
    width: 56px; height: 56px; margin: 0 auto 14px;
    border-radius: 16px; background: var(--cream-deep);
    display: flex; align-items: center; justify-content: center;
    color: var(--terracotta);
  }
  .empty-title {
    font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600;
    color: var(--brown); margin-bottom: 6px;
  }
  .empty-text { font-size: 14px; max-width: 280px; margin: 0 auto 18px; }

  /* ==== Modal ==== */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(61, 40, 23, 0.4);
    backdrop-filter: blur(4px);
    z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.18s ease;
  }
  @media (min-width: 600px) {
    .modal-backdrop { align-items: center; }
  }
  .modal {
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    width: 100%; max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.22s ease;
  }
  @media (min-width: 600px) {
    .modal { border-radius: 18px; }
  }
  .modal-header {
    padding: 20px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
  }
  .modal-body { padding: 18px 20px; }
  .modal-footer {
    padding: 14px 20px 20px;
    display: flex; gap: 10px; justify-content: flex-end;
    border-top: 1px solid var(--border-soft);
    background: var(--surface);
    position: sticky; bottom: 0;
  }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: none; background: var(--cream-deep);
    color: var(--brown-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .icon-btn:hover { background: var(--border); color: var(--brown); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* ==== Bake timeline ==== */
  .phase-active {
    background: linear-gradient(135deg, rgba(196, 98, 59, 0.06), rgba(196, 98, 59, 0.02));
    border: 1.5px solid var(--terracotta);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .phase-name {
    font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600;
    color: var(--brown); margin-bottom: 4px;
  }
  .phase-instr { font-size: 14px; color: var(--brown-soft); margin-bottom: 14px; }
  .timer-display {
    font-family: 'Fraunces', serif;
    font-variant-numeric: tabular-nums;
    font-size: 44px; font-weight: 500;
    color: var(--terracotta); letter-spacing: -0.03em;
    margin: 8px 0;
  }
  .timer-target {
    font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .phase-list { margin-top: 18px; }
  .phase-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .phase-item:last-child { border-bottom: none; }
  .phase-dot {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    flex-shrink: 0; margin-top: 2px;
    position: relative;
  }
  .phase-item.done .phase-dot {
    background: var(--sage); border-color: var(--sage);
  }
  .phase-item.done .phase-dot::after {
    content: '✓'; position: absolute; inset: 0; color: white;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .phase-item.current .phase-dot {
    border-color: var(--terracotta); background: var(--terracotta);
    box-shadow: 0 0 0 4px rgba(196, 98, 59, 0.18);
  }
  .phase-item-name {
    font-weight: 600; font-size: 14px; color: var(--brown);
  }
  .phase-item.done .phase-item-name { color: var(--muted); text-decoration: line-through; }
  .phase-item-time { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ==== Notification banner ==== */
  .notif-banner {
    background: linear-gradient(135deg, var(--amber-soft), #FAEACC);
    border: 1px solid #E8C796;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #6B4519;
  }
  .notif-banner .btn { margin-left: auto; }

  /* ==== Misc ==== */
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack > * + * { margin-top: 12px; }
  .text-muted { color: var(--muted); }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 12px; }
  .mt-2 { margin-top: 8px; }
  .mt-4 { margin-top: 16px; }
  .mb-2 { margin-bottom: 8px; }
  .gap-2 { gap: 8px; }
  .flex { display: flex; }
  .hidden { display: none; }

  /* Star rating */
  .stars {
    display: inline-flex; align-items: center; gap: 2px;
    color: var(--border);
  }
  .stars.interactive .star-btn {
    cursor: pointer; padding: 2px;
    background: transparent; border: none;
    color: inherit; transition: transform 0.1s ease;
  }
  .stars.interactive .star-btn:hover { transform: scale(1.15); }
  .star-btn { display: inline-flex; }
  .star-btn.on { color: var(--amber); }
  .stars.readonly .star-btn { padding: 0; cursor: default; }
  .star-meta {
    font-size: 12px; color: var(--muted);
    margin-left: 6px; font-weight: 600;
  }

  /* Review cards */
  .review-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.18s ease;
    margin-bottom: 12px;
  }
  .review-card:hover {
    border-color: var(--terracotta);
    box-shadow: var(--shadow-md);
  }
  .review-card-title {
    font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600;
    color: var(--brown);
  }
  .review-card-date {
    font-size: 12px; color: var(--muted); margin-top: 1px;
  }
  .review-card-issues {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 8px;
  }
  .issue-pill {
    background: var(--cream-deep);
    color: var(--brown-soft);
    padding: 3px 9px; border-radius: 8px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.01em;
  }
  .review-notes-preview {
    font-size: 13px; color: var(--brown-soft);
    margin-top: 8px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Diagnosis panel */
  .diagnosis-panel {
    background: linear-gradient(135deg, var(--sage-soft), #E0EBD3);
    border: 1px solid #B7CFA3;
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 14px;
  }
  .diagnosis-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
    font-family: 'Fraunces', serif; font-weight: 600;
    color: #3D5C24; font-size: 16px;
  }
  .diagnosis-headline {
    font-size: 14px; color: #2E4519;
    margin-bottom: 14px; padding: 10px 12px;
    background: rgba(255,255,255,0.5);
    border-radius: 8px; line-height: 1.5;
    font-weight: 500;
  }
  .diagnosis-item {

const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

const supabaseClient = (
  SUPABASE_URL.startsWith('YOUR_') ||
  SUPABASE_ANON_KEY.startsWith('YOUR_') ||
  !window.supabase
) ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORAGE_KEY = 'crumb.state.v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* ignore quota */ }
}

// ============================================================
//  Auth + cloud sync helpers (Supabase)
// ============================================================
async function authSignUp(email, password) {
  if (!supabaseClient) throw new Error('Sign-in is not configured yet.');
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) throw error;
  return data;
}

async function authSignIn(email, password) {
  if (!supabaseClient) throw new Error('Sign-in is not configured yet.');
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data;
}

async function authSignOut() {
  if (!supabaseClient) return;
  await supabaseClient.auth.signOut();
}

async function authResetPassword(email) {
  if (!supabaseClient) throw new Error('Sign-in is not configured yet.');
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
  if (error) throw error;
}

async function fetchCloudData(userId) {
  if (!supabaseClient) return null;
  const { data, error } = await supabaseClient
    .from('crumb_data')
    .select('data')
    .eq('user_id', userId)
    .maybeSingle();
  if (error) {
    console.error('Cloud fetch failed', error);
    return null;
  }
  return data?.data || null;
}

async function pushCloudData(userId, stateData) {
  if (!supabaseClient) return;
  const { error } = await supabaseClient
    .from('crumb_data')
    .upsert({
      user_id: userId,
      data: stateData,
      updated_at: new Date().toISOString(),
    });
  if (error) console.error('Cloud push failed', error);
}

function hasLocalData(state) {
  if (!state) return false;
  if (state.activeBake) return true;
  if ((state.reviews || []).length > 0) return true;
  if ((state.starters || []).some(s => (s.feedings || []).length > 0)) return true;
  if ((state.starters || []).some(s => s.name && s.name !== 'My Starter')) return true;
  const libIds = new Set(RECIPE_LIBRARY.map(r => r.id));
  if ((state.recipes || []).some(r => !libIds.has(r.id))) return true;
  return false;
}

function diagnosePattern(issueKeys) {
  const set = new Set(issueKeys);
  if (set.has('dense') && set.has('flat') && set.has('under-proofed')) {
    return "Strong signs of under-proofed dough. The yeast didn't have enough time to lift the loaf. Most common fix: extend bulk fermentation until the dough is visibly puffy with surface bubbles, and make sure your starter is at peak when you use it.";
  }
  if (set.has('over-proofed') && (set.has('spread') || set.has('tunnels'))) {
    return "Strong signs of over-proofed dough. Fermentation went too long and the gluten weakened. Shorten bulk by 30–60 min next time, and keep your retard fridge consistently cold.";
  }
  if (set.has('gummy') && (set.has('dense') || set.has('doughy'))) {
    return "Most likely under-baked, or sliced too soon. Try baking 5–10 min longer, and always let the loaf cool to room temperature (at least 1 hour) before cutting.";
  }
  if (set.has('too-sour') && set.has('flat')) {
    return "Long fermentation produced both the sour notes and weakened the gluten. Try a shorter bulk or a colder retard.";
  }
  if (set.has('bland') && set.has('dense')) {
    return "Both flavor and structure suggest the dough didn't ferment long enough. Give it more time at room temp during bulk, or extend the cold retard.";
  }
  if (set.has('pale-crust') && set.has('doughy')) {
    return "Classic signs of under-baking. Increase oven temperature, bake longer, and use a thermometer to confirm 95–98°C internal temp.";
  }
  return null;
}

// ============================================================
//  Reducer
// ============================================================
function reducer(state, action) {
  switch (action.type) {
    case 'SET_TAB':
      return { ...state, ui: { ...state.ui, tab: action.tab } };

    case 'UPDATE_STARTER':
      return {
        ...state,
        starters: state.starters.map(s => s.id === action.id ? { ...s, ...action.patch } : s),
      };

    case 'ADD_STARTER':
      return {
        ...state,
        starters: [...state.starters, action.starter],
        activeStarterId: action.starter.id,
      };

    case 'DELETE_STARTER': {
      if (state.starters.length <= 1) return state;
      const remaining = state.starters.filter(s => s.id !== action.id);
      return {
        ...state,
        starters: remaining,
        activeStarterId: state.activeStarterId === action.id ? remaining[0].id : state.activeStarterId,
      };
    }

    case 'SET_ACTIVE_STARTER':
      return { ...state, activeStarterId: action.id };

    case 'IDLE_STARTER':
      return {
        ...state,
        starters: state.starters.map(s => s.id === action.id ? { ...s, idle: true, idleStartedAt: Date.now() } : s),
      };

    case 'WAKE_STARTER':
      return {
        ...state,
        starters: state.starters.map(s => s.id === action.id ? { ...s, idle: false, idleStartedAt: null, wokeAt: Date.now() } : s),
      };

    case 'DISMISS_IDLE_SUGGESTION':
      return {
        ...state,
        starters: state.starters.map(s => s.id === action.id ? { ...s, idleSuggestionDismissedAt: Date.now() } : s),
      };

    case 'ADD_FEEDING':
      return {
        ...state,
        starters: state.starters.map(s =>
          s.id === action.starterId
            ? { ...s, feedings: [action.feeding, ...s.feedings].slice(0, 100) }
            : s
        ),
      };

    case 'DELETE_FEEDING':
      return {
        ...state,
        starters: state.starters.map(s =>
          s.id === action.starterId
            ? { ...s, feedings: s.feedings.filter(f => f.id !== action.feedingId) }
            : s
        ),
      };

    case 'ADD_RECIPE':
      return { ...state, recipes: [...state.recipes, action.recipe] };

    case 'UPDATE_RECIPE':
      return {
        ...state,
        recipes: state.recipes.map(r => r.id === action.recipe.id ? action.recipe : r),
      };

    case 'DELETE_RECIPE':
      return { ...state, recipes: state.recipes.filter(r => r.id !== action.id) };

    case 'DELETE_RECIPES':
      return { ...state, recipes: state.recipes.filter(r => !action.ids.includes(r.id)) };

    case 'ADD_REVIEW':
      return { ...state, reviews: [action.review, ...(state.reviews || [])] };

    case 'UPDATE_REVIEW':
      return {
        ...state,
        reviews: (state.reviews || []).map(rv => rv.id === action.review.id ? action.review : rv),
      };

    case 'DELETE_REVIEW':
      return { ...state, reviews: (state.reviews || []).filter(rv => rv.id !== action.id) };

    case 'START_BAKE':
      return {
        ...state,
        activeBake: action.bake,
        ui: { ...state.ui, tab: 'bake' },
      };

    case 'ADVANCE_PHASE':
      return { ...state, activeBake: action.bake };

    case 'UPDATE_BAKE':
      return { ...state, activeBake: action.bake };

    case 'CANCEL_BAKE':
      return { ...state, activeBake: null };

    case 'SET_NOTIFICATIONS':
      return { ...state, notificationsEnabled: action.enabled };

    case 'HYDRATE':
      return { ...defaultState, ...action.state, ui: { ...defaultState.ui, ...(action.state?.ui || {}) } };

    default: return state;
  }
}

// ============================================================
//  Starter peak prediction
//  Q10-style model: rises faster in warmth, slower at colder temps
// ============================================================
function predictPeakHours(ratio, tempC) {
  // baseline: 1:1:1 at 24°C peaks ~5h
  const baseHours = 5;
  const flourPart = ratio.flour / Math.max(ratio.starter, 0.1);
  const ratioFactor = Math.pow(flourPart, 0.35); // 1:1:1 -> 1, 1:5:5 -> ~1.78
  // Q10 ≈ 2 per 10°C
  const tempFactor = Math.pow(2, (24 - tempC) / 10);
  const hours = baseHours * ratioFactor * tempFactor;
  return Math.max(1.5, Math.min(24, hours));
}

function starterStatus(feedings, ambientTempC, wokeAt = null) {
  // Just woken from the fridge, no feeding logged since — needs refreshing first
  if (wokeAt) {
    const lastF = feedings[0];
    if (!lastF || lastF.ts < wokeAt) {
      return { state: 'hungry-wake', label: 'Refresh to wake up', color: 'rose', progress: 1, isWaking: true };
    }
  }

  if (!feedings.length) {
    return { state: 'unknown', label: 'No feedings yet', color: 'brown', progress: 0 };
  }
  const last = feedings[0];

  // First 1–2 feeds after the fridge are sluggish — apply a multiplier so peak predictions stay honest
  const postWakeFeedings = wokeAt ? feedings.filter(f => f.ts >= wokeAt).length : Infinity;
  const wakeMultiplier = postWakeFeedings <= 1 ? 1.5
    : postWakeFeedings === 2 ? 1.2
    : 1.0;
  const isWaking = postWakeFeedings <= 2;

  const peakH = predictPeakHours(last.ratio, last.tempC ?? ambientTempC) * wakeMultiplier;
  const elapsedH = (Date.now() - last.ts) / 3_600_000;
  const peakStart = peakH * 0.85;
  const peakEnd = peakH * 1.2;
  const progress = Math.min(1, elapsedH / peakH);

  if (elapsedH < 0.75) return { state: 'fed', label: 'Just fed', color: 'brown', progress, peakH, elapsedH, isWaking };
  if (elapsedH < peakStart) return { state: 'rising', label: 'Rising', color: 'amber', progress, peakH, elapsedH, isWaking };
  if (elapsedH <= peakEnd) return { state: 'peak', label: 'At peak — use now', color: 'sage', progress: 1, peakH, elapsedH, isWaking };
  if (elapsedH > 12) return { state: 'hungry', label: 'Hungry — feed soon', color: 'rose', progress: 1, peakH, elapsedH, isWaking };
  return { state: 'past', label: 'Past peak', color: 'brown', progress: 1, peakH, elapsedH, isWaking };
}

function getActiveStarter(state) {
  return state.starters.find(s => s.id === state.activeStarterId) || state.starters[0];
}

function totalFlour(recipe) {
  if (Array.isArray(recipe?.flours)) {
    return recipe.flours.reduce((sum, f) => sum + (Number(f.grams) || 0), 0);
  }
  return Number(recipe?.flourTotal) || 0;
}

function flourBlendLabel(recipe) {
  const flours = (recipe?.flours || []).filter(f => Number(f.grams) > 0);
  if (flours.length === 0) return '';
  if (flours.length === 1) return flours[0].name;
  const total = flours.reduce((s, f) => s + Number(f.grams), 0);
  return flours
    .map(f => `${Math.round((Number(f.grams) / total) * 100)}% ${f.name}`)
    .join(' + ');
}

function needsIdleSuggestion(starter) {
  if (!starter || starter.idle) return false;
  const last = starter.feedings?.[0];
  if (!last) return false;
  const daysSinceFed = (Date.now() - last.ts) / 86400000;
  if (daysSinceFed < 5) return false;
  if (starter.idleSuggestionDismissedAt) {
    const daysSinceDismiss = (Date.now() - starter.idleSuggestionDismissedAt) / 86400000;
    // Resurface dismissal if it was before the most recent feeding,
    // otherwise snooze for 3 days at a time
    if (starter.idleSuggestionDismissedAt > last.ts && daysSinceDismiss < 3) return false;
  }
  return true;
}

function ageOfStarter(starter) {
  if (!starter?.createdAt) return 'unknown';
  const days = Math.floor((Date.now() - starter.createdAt) / 86400000);
  if (days < 1) return 'created today';
  if (days === 1) return '1 day old';
  if (days < 14) return `${days} days old`;
  if (days < 60) return `${Math.floor(days / 7)} weeks old`;
  const months = Math.floor(days / 30);
  if (months < 12) return `${months} month${months === 1 ? '' : 's'} old`;
  const years = Math.floor(days / 365);
  return `${years} year${years === 1 ? '' : 's'} old`;
}

function ageShort(starter) {
  if (!starter?.createdAt) return '';
  const days = Math.floor((Date.now() - starter.createdAt) / 86400000);
  if (days < 1) return 'new';
  if (days < 30) return `${days}d`;
  const months = Math.floor(days / 30);
  if (months < 12) return `${months}mo`;
  return `${Math.floor(days / 365)}y`;
}

function fmtDateOnly(ts) {
  return new Date(ts).toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
}

// ============================================================
//  Time helpers
// ============================================================
function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const day = d >= today ? 'Today' :
              d >= yest ? 'Yesterday' :
              d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return `${day}, ${fmtTime(ts)}`;
}
function fmtDuration(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function fmtHoursPretty(h) {
  if (h < 1) return `${Math.round(h * 60)} min`;
  const whole = Math.floor(h);
  const mins = Math.round((h - whole) * 60);
  if (mins === 0) return `${whole}h`;
  return `${whole}h ${mins}m`;
}
function fmtRelative(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min} min ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const d = Math.floor(hr / 24);
  return `${d}d ago`;
}

async function requestNotificationPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

function showNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body, icon: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C4623B'/></svg>" });
  } catch (e) { /* ignore */ }
}

function StarRating({ value = 0, onChange, size = 18, interactive = false, showMeta = false, count = 0 }) {
  const handle = (v) => () => { if (interactive && onChange) onChange(v); };
  return h('span', { className: `stars ${interactive ? 'interactive' : 'readonly'}` },
    [1, 2, 3, 4, 5].map(i => h('button', {
      key: i, type: 'button',
      className: 'star-btn' + (i <= value ? ' on' : ''),
      onClick: handle(i),
      tabIndex: interactive ? 0 : -1,
      'aria-label': interactive ? `${i} star${i === 1 ? '' : 's'}` : null,
    }, h(Icon, { name: i <= value ? 'star' : 'star-outline', size }))),
    showMeta && count > 0 && h('span', { className: 'star-meta' }, `${value.toFixed(1)} (${count})`),
  );
}

function getRecipeRating(recipeId, reviews) {
  const rs = (reviews || []).filter(r => r.recipeId === recipeId && r.rating > 0);
  if (rs.length === 0) return null;
  const avg = rs.reduce((sum, r) => sum + r.rating, 0) / rs.length;
  return { avg, count: rs.length };
}

function IdleSuggestionCard({ starter, dispatch, toast, onLogFeeding }) {
  if (!needsIdleSuggestion(starter)) return null;
  const last = starter.feedings[0];
  const daysSince = Math.floor((Date.now() - last.ts) / 86400000);

  return h('div', { className: 'suggestion-card' },
    h('div', { className: 'suggestion-icon' }, h(Icon, { name: 'snowflake', size: 18 })),
    h('div', { className: 'suggestion-body' },
      h('div', { className: 'suggestion-title' }, `${starter.name} hasn't been fed in ${daysSince} days`),
      h('div', { className: 'suggestion-text' },
        "If it's resting in the fridge, mark it as idle so notifications pause. If you forgot, log a feeding now."
      ),
      h('div', { className: 'suggestion-actions' },
        h('button', {
          className: 'btn btn-sm btn-primary',
          onClick: () => {
            dispatch({ type: 'IDLE_STARTER', id: starter.id });
            toast(`${starter.name} is now in the fridge`);
          },
        }, h(Icon, { name: 'snowflake', size: 14 }), 'Put in fridge'),
        onLogFeeding && h('button', {
          className: 'btn btn-sm',
          onClick: onLogFeeding,
        }, h(Icon, { name: 'plus', size: 14 }), 'Log feeding'),
        h('button', {
          className: 'btn btn-sm btn-ghost',
          onClick: () => dispatch({ type: 'DISMISS_IDLE_SUGGESTION', id: starter.id }),
        }, 'Dismiss'),
      ),
    ),
  );
}

function FactCard() {
  const [idx, setIdx] = useState(() => Math.floor(Math.random() * SOURDOUGH_FACTS.length));
  const shuffle = () => {
    let next = idx;
    while (next === idx && SOURDOUGH_FACTS.length > 1) {
      next = Math.floor(Math.random() * SOURDOUGH_FACTS.length);
    }
    setIdx(next);
  };
  return h('div', { className: 'fact-card' },
    h('div', { className: 'fact-icon' }, h(Icon, { name: 'sparkle', size: 18 })),
    h('div', { className: 'fact-body' },
      h('div', { className: 'fact-label' }, 'Did you know?'),
      h('div', { className: 'fact-text' }, SOURDOUGH_FACTS[idx]),
    ),
    h('button', {
      className: 'fact-shuffle', onClick: shuffle,
      title: 'Show another fact', 'aria-label': 'Show another fact', type: 'button',
    }, h(Icon, { name: 'shuffle', size: 16 })),
  );
}

function HelpTip({ label, text }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    const close = (e) => {
      if (e.target.closest && e.target.closest('.helptip')) return;
      setOpen(false);
    };
    const t = setTimeout(() => document.addEventListener('click', close), 0);
    return () => { clearTimeout(t); document.removeEventListener('click', close); };
  }, [open]);
  return h('span', { className: 'helptip' },
    label,
    h('button', {
      type: 'button',
      className: 'helptip-icon',
      onClick: (e) => { e.stopPropagation(); setOpen(o => !o); },
      'aria-label': 'What does this mean?',
      tabIndex: 0,
    }, '?'),
    h('span', { className: 'helptip-popup' + (open ? ' open' : '') }, text),
  );
}

function ActiveBakeSummary({ state, dispatch, setTab }) {
  const bake = state.activeBake;
  const recipe = state.recipes.find(r => r.id === bake.recipeId);
  if (!recipe) return null;
  const phase = bakePhases(recipe)[bake.currentPhase];
  const elapsed = Date.now() - bake.phaseStartedAt;
  const remaining = phase.duration - elapsed;

  return h('div', { className: 'card-hero', style: { borderColor: 'var(--terracotta)' } },
    h('div', { className: 'row-between', style: { marginBottom: 12 } },
      h('div', null,
        h('div', { className: 'text-xs text-muted', style: { textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600 } }, 'Active bake'),
        h('div', { className: 'starter-name', style: { fontSize: 22 } }, recipe.name),
      ),
      h('span', { className: 'badge terracotta' }, `Phase ${bake.currentPhase + 1} / ${bakePhases(recipe).length}`),
    ),
    h('div', { style: { fontFamily: 'Fraunces, serif', fontWeight: 600, fontSize: 18 } }, phase.name),
    h('div', { className: 'timer-display', style: { fontSize: 32 } }, fmtDuration(remaining)),
    h('button', { className: 'btn btn-primary btn-block', onClick: () => setTab('bake') }, 'Open timeline'),
  );
}

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Late night bake?';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 21) return 'Good evening';
  return 'Quiet hours';
}

    ? { state: 'idle', label: 'In the fridge', color: 'ice', progress: 0 }

    if (active.idle) {
      dispatch({ type: 'WAKE_STARTER', id: active.id });
      toast(`${active.name} woken up — feed once or twice before baking`);
    } else {
      dispatch({ type: 'IDLE_STARTER', id: active.id });

  return h('div', null,
    // Switcher
    h('div', { className: 'starter-switcher' },
      state.starters.map(s => {
        const isActive = s.id === active.id;

          h('span', { className: 'switcher-card-meta' },
            s.idle ? 'In fridge' : `${ageShort(s)} • ${s.feedings.length} feed${s.feedings.length === 1 ? '' : 's'}`,

      }),
      h('button', {
        className: 'switcher-card add',
        onClick: () => setShowAdd(true),
        type: 'button',
      }, h(Icon, { name: 'plus', size: 14 }), 'New'),
    ),

    h('div', { className: 'row-between', style: { marginBottom: 4 } },
      h('h1', null, active.name),

          h(Icon, { name: 'plus', size: 16 }), 'Log feeding',
        ),
        h('button', { className: 'btn', style: { flex: 1, minWidth: 140 }, onClick: toggleIdle },
          h(Icon, { name: active.idle ? 'sunUp' : 'snowflake', size: 16 }),

        dispatch({ type: 'ADD_FEEDING', starterId: active.id, feeding });
        setShowFeed(false);
        // Tailor the toast if we're mid wake-up sequence
        if (active.wokeAt) {
          const prior = active.feedings.filter(f => f.ts >= active.wokeAt).length;
          const counted = feeding.ts >= active.wokeAt ? prior + 1 : prior;
          if (counted === 1) toast('1 of 2 refresh feeds done — one more should restore normal timing');
          else if (counted === 2) toast('2 of 2 refresh feeds done — one more and you\'re back to normal');
          else if (counted === 3) toast('Back to normal rhythm — predictions reset');
          else toast('Feeding logged');
        } else {
          toast('Feeding logged');
        }
      },
    }),

    showSettings && h(StarterSettingsModal, {
      starter: active,
      canDelete: state.starters.length > 1,

        if (confirm(`Delete "${active.name}"? Feedings will be lost.`)) {
          dispatch({ type: 'DELETE_STARTER', id: active.id });
          setShowSettings(false);
          toast('Starter deleted');
        }
      },
    }),

    showAdd && h(AddStarterModal, {
      onClose: () => setShowAdd(false),
      onSave: (starter) => {
        dispatch({ type: 'ADD_STARTER', starter });
        setShowAdd(false);
        toast(`Added "${starter.name}"`);
      },
    }),
  );
}

function FeedingModal({ starter, onClose, onSave }) {
  const def = starter.defaultRatio;

  const [whenMode, setWhenMode] = useState('now');
  const [customTime, setCustomTime] = useState(() => {
    const d = new Date(); return d.toTimeString().slice(0,5);
  });

  const isCustom = !FLOUR_PRESETS.includes(flour) || flour === '__custom__';
  const finalFlour = flour === '__custom__' ? customFlour.trim() : flour;

  const submit = (e) => {
    e.preventDefault();
    let ts = Date.now();

function RecipesTab({ state, dispatch, toast, setTab }) {
  const [editing, setEditing] = useState(null); // recipe or 'new'
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState(() => new Set());

  const toggleSelect = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };
  const exitSelect = () => { setSelectMode(false); setSelected(new Set()); };
  const selectAll = () => setSelected(new Set(state.recipes.map(r => r.id)));
  const deleteSelected = () => {
    if (selected.size === 0) return;
    if (confirm(`Delete ${selected.size} recipe${selected.size === 1 ? '' : 's'}? This cannot be undone.`)) {
      dispatch({ type: 'DELETE_RECIPES', ids: Array.from(selected) });
      toast(`Deleted ${selected.size} recipe${selected.size === 1 ? '' : 's'}`);
      exitSelect();
    }
  };

  return h('div', null,
    h('div', { className: 'row-between', style: { flexWrap: 'wrap', gap: 8 } },
      h('div', null,
        h('h1', null, 'Recipes'),
        h('p', { className: 'subtitle', style: { marginBottom: 0 } },
          selectMode
            ? `${selected.size} of ${state.recipes.length} selected`
            : `${state.recipes.length} saved`
        ),
      ),
      h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
        selectMode
          ? h(React.Fragment, null,
              h('button', { className: 'btn btn-sm', onClick: selectAll }, 'Select all'),
              h('button', { className: 'btn btn-sm', onClick: exitSelect }, 'Cancel'),
              selected.size > 0 && h('button', { className: 'btn btn-sm btn-danger', onClick: deleteSelected },
                h(Icon, { name: 'trash', size: 14 }), `Delete ${selected.size}`,
              ),
            )
          : h(React.Fragment, null,
              state.recipes.length > 0 && h('button', { className: 'btn btn-sm', onClick: () => setSelectMode(true) },
                h(Icon, { name: 'check', size: 14 }), 'Select',
              ),
              h('button', { className: 'btn btn-primary btn-sm', onClick: () => setEditing('new') },
                h(Icon, { name: 'plus', size: 16 }), 'New recipe',
              ),
            ),
      ),
    ),

    h('div', { style: { height: 16 } }),

    state.recipes.length === 0
      ? h('div', { className: 'card' },
          h('div', { className: 'empty' },
            h('div', { className: 'empty-mark' }, h(Icon, { name: 'book', size: 24 })),
            h('div', { className: 'empty-title' }, 'No recipes yet'),
            h('div', { className: 'empty-text' }, 'Save your favourite formulas and start a bake from any of them.'),
            h('button', { className: 'btn btn-primary', onClick: () => setEditing('new') }, 'Create first recipe'),
          )
        )
      : h('div', { className: 'recipe-grid' },
          state.recipes.map(r => {
            const flourW = totalFlour(r);
            const hydration = flourW ? Math.round((r.water / flourW) * 100) : 0;
            const salt = flourW ? ((r.salt / flourW) * 100).toFixed(1) : 0;
            const starterPct = flourW ? Math.round((r.starter / flourW) * 100) : 0;
            const extrasW = (r.extras || []).reduce((s, x) => s + (Number(x.grams) || 0), 0);
            const totalWeight = flourW + r.water + r.salt + r.starter + extrasW;
            const extrasCount = (r.extras || []).length;
            const blend = flourBlendLabel(r);
            const isSel = selected.has(r.id);
            const rating = getRecipeRating(r.id, state.reviews);
            return h('div', {
              key: r.id,
              className: 'recipe-card' + (selectMode && isSel ? ' selected' : ''),
              onClick: () => selectMode ? toggleSelect(r.id) : setEditing(r),
            },
              selectMode && h('div', { className: 'recipe-checkbox' + (isSel ? ' checked' : '') },
                isSel && h(Icon, { name: 'check', size: 13 }),
              ),
              h('div', { style: { flex: 1, minWidth: 0 } },
                h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' } },
                  h('div', { className: 'recipe-card-title' }, r.name),
                  rating && h(StarRating, { value: rating.avg, size: 13, showMeta: true, count: rating.count }),
                ),
                h('div', { className: 'recipe-card-meta' },
                  blend && h('span', null, blend),
                  h('span', null, `${hydration}% hydration`),
                  h('span', null, `${starterPct}% starter`),
                  extrasCount > 0 && h('span', null, `+${extrasCount} add-in${extrasCount === 1 ? '' : 's'}`),
                ),
              ),
              !selectMode && h('button', {
                className: 'btn btn-sm btn-primary',
                onClick: (e) => {
                  e.stopPropagation();
                  const bake = newBake(r);
                  dispatch({ type: 'START_BAKE', bake });
                  toast(`Started "${r.name}"`);
                },
              }, 'Bake', h(Icon, { name: 'arrow', size: 14 })),
            );
          })
        ),

    editing && h(RecipeModal, {
      recipe: editing === 'new' ? null : editing,
      onClose: () => setEditing(null),
      onSave: (recipe) => {
        if (editing === 'new') dispatch({ type: 'ADD_RECIPE', recipe });
        else dispatch({ type: 'UPDATE_RECIPE', recipe });
        setEditing(null);
        toast(editing === 'new' ? 'Recipe added' : 'Recipe saved');
      },
      onDelete: editing !== 'new' ? () => {
        dispatch({ type: 'DELETE_RECIPE', id: editing.id });
        setEditing(null);
        toast('Recipe deleted');
      } : null,
    }),
  );
}

function RecipeModal({ recipe, onClose, onSave, onDelete }) {
  const [r, setR] = useState(recipe || {
    id: uid(),
    name: '',
    flours: [{ id: uid(), name: 'Bread flour', grams: 500 }],
    water: 360, salt: 10, starter: 100,
    extras: [],
    notes: '',
    bulkHours: 4.5, foldCount: 4, foldIntervalMin: 45,
    retardHours: 12, bakeMin: 45,
  });

  const flours = r.flours || [];
  const flourTotal = flours.reduce((s, f) => s + (Number(f.grams) || 0), 0);
  const hydration = flourTotal ? ((r.water / flourTotal) * 100).toFixed(0) : 0;
  const saltPct = flourTotal ? ((r.salt / flourTotal) * 100).toFixed(1) : 0;
  const starterPct = flourTotal ? ((r.starter / flourTotal) * 100).toFixed(0) : 0;
  const extras = r.extras || [];
  const extrasTotal = extras.reduce((sum, x) => sum + (Number(x.grams) || 0), 0);
  const total = flourTotal + (r.water || 0) + (r.salt || 0) + (r.starter || 0) + extrasTotal;

  const set = (k, v) => setR({ ...r, [k]: v });

  const addFlour = () => setR({ ...r, flours: [...flours, { id: uid(), name: '', grams: 0 }] });
  const updateFlour = (id, patch) => setR({
    ...r,
    flours: flours.map(f => f.id === id ? { ...f, ...patch } : f),
  });
  const removeFlour = (id) => {
    if (flours.length <= 1) return; // always keep at least one
    setR({ ...r, flours: flours.filter(f => f.id !== id) });
  };

  const addExtra = () => setR({ ...r, extras: [...extras, { id: uid(), name: '', grams: 0 }] });
  const updateExtra = (id, patch) => setR({
    ...r,
    extras: extras.map(x => x.id === id ? { ...x, ...patch } : x),
  });
  const removeExtra = (id) => setR({ ...r, extras: extras.filter(x => x.id !== id) });

  const submit = (e) => {
    e.preventDefault();
    if (!r.name.trim()) return;
    const cleanedFlours = flours
      .filter(f => f.name.trim() && Number(f.grams) > 0)
      .map(f => ({ ...f, name: f.name.trim(), grams: Number(f.grams) }));
    if (cleanedFlours.length === 0) {
      cleanedFlours.push({ id: uid(), name: 'Bread flour', grams: 500 });
    }
    const cleanedExtras = extras
      .filter(x => x.name.trim() && Number(x.grams) > 0)
      .map(x => ({ ...x, name: x.name.trim(), grams: Number(x.grams) }));
    onSave({ ...r, name: r.name.trim(), flours: cleanedFlours, extras: cleanedExtras });
  };

  return h(Modal, { title: recipe ? 'Edit recipe' : 'New recipe', onClose },
    h('form', { onSubmit: submit },

      ),
      h('div', { className: 'modal-body' },
        h('div', { className: 'field' },
          h('label', { className: 'field-label' }, 'Name'),
          h('input', { className: 'input', value: r.name, onChange: e => set('name', e.target.value), placeholder: 'e.g. Saturday Sourdough', autoFocus: true, required: true }),
        ),

        // Flours (multi)
        h('div', { className: 'field' },
          h('label', { className: 'field-label' }, `Flour${flours.length > 1 ? ` (${flourTotal}g total)` : ''}`),
          flours.map(f =>
            h('div', { key: f.id, className: 'extra-row' },
              h('input', {
                type: 'text',
                list: 'flour-options',
                className: 'input',

                value: f.name,
                onChange: e => updateFlour(f.id, { name: e.target.value }),
              }),
              h('div', { className: 'input-suffix-wrap' },
                h('input', { type: 'number', min: '0', className: 'input', value: f.grams, onChange: e => updateFlour(f.id, { grams: e.target.value }) }),
                h('span', { className: 'input-suffix' }, 'g'),
              ),
              h('button', {
                type: 'button',
                className: 'icon-btn',
                onClick: () => removeFlour(f.id),
                disabled: flours.length <= 1,
                title: flours.length <= 1 ? 'At least one flour required' : 'Remove',
                'aria-label': 'Remove flour',
                style: flours.length <= 1 ? { opacity: 0.3, cursor: 'not-allowed' } : null,

// -------------------- Bake tab --------------------
function bakePhases(recipe) {
  return [
    { key: 'mix', name: 'Mix & autolyse', duration: 30 * 60000, instr: 'Combine flour, water, starter and salt. Let rest covered.' },
    { key: 'bulk', name: 'Bulk ferment', duration: (recipe.bulkHours || 4.5) * 3600000, instr: `Ferment at room temperature with ${recipe.foldCount} stretch & folds every ${recipe.foldIntervalMin} min.`, folds: true },
    { key: 'preshape', name: 'Pre-shape & bench rest', duration: 30 * 60000, instr: 'Turn out, pre-shape into a round, rest 20–30 min uncovered.' },
    { key: 'shape', name: 'Final shape', duration: 10 * 60000, instr: 'Shape and place seam-up in a floured banneton.' },
    { key: 'retard', name: 'Cold retard', duration: (recipe.retardHours || 12) * 3600000, instr: 'Cover and refrigerate. Develops flavour and structure.' },
    { key: 'bake', name: 'Bake', duration: (recipe.bakeMin || 45) * 60000, instr: 'Score and bake. Steam for the first half, vent for crust.' },
  ];
}

function newBake(recipe) {
  const phases = bakePhases(recipe);
  const startedAt = Date.now();
  return {
    id: uid(),
    recipeId: recipe.id,
    startedAt,
    currentPhase: 0,
    phaseStartedAt: startedAt,
    completedPhases: [],
    folds: buildFolds(recipe, startedAt + phases[0].duration), // bulk starts after phase 0
  };
}

function buildFolds(recipe, bulkStart) {
  const folds = [];
  for (let i = 0; i < (recipe.foldCount || 0); i++) {
    folds.push({
      ts: bulkStart + (i + 1) * (recipe.foldIntervalMin || 45) * 60000,
      done: false,
      index: i + 1,
    });
  }
  return folds;
}

function BakeTab({ state, dispatch, toast, onFinishBake }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  if (!state.activeBake) {
    return h('div', null,
      h('h1', null, 'Start a bake'),
      h('p', { className: 'subtitle' }, 'Pick a recipe to begin the timeline.'),
      state.recipes.length === 0
        ? h('div', { className: 'card' },
            h('div', { className: 'empty' },
              h('div', { className: 'empty-mark' }, h(Icon, { name: 'bake', size: 24 })),
              h('div', { className: 'empty-title' }, 'No recipes saved'),
              h('div', { className: 'empty-text' }, 'Add a recipe first, then you can start a bake from it.'),
            ),
          )
        : h('div', { className: 'recipe-grid' },
            state.recipes.map(r =>
              h('div', { key: r.id, className: 'recipe-card', onClick: () => {
                dispatch({ type: 'START_BAKE', bake: newBake(r) });
                toast(`Started "${r.name}"`);
              } },
                h('div', null,
                  h('div', { className: 'recipe-card-title' }, r.name),
                  h('div', { className: 'recipe-card-meta' },
                    h('span', null, `Bulk ${fmtHoursPretty(r.bulkHours)}`),
                    h('span', null, `Retard ${fmtHoursPretty(r.retardHours)}`),
                    h('span', null, `Bake ${r.bakeMin} min`),
                  ),
                ),
                h('span', { className: 'btn btn-sm btn-primary' }, 'Start', h(Icon, { name: 'arrow', size: 14 })),
              ),
            )
          ),
    );
  }

  const bake = state.activeBake;
  const recipe = state.recipes.find(r => r.id === bake.recipeId);
  if (!recipe) {
    return h('div', { className: 'card' },
      h('p', null, 'The recipe for this bake was deleted.'),
      h('button', { className: 'btn btn-primary', onClick: () => dispatch({ type: 'CANCEL_BAKE' }) }, 'Cancel bake'),
    );
  }

  const phases = bakePhases(recipe);
  const phase = phases[bake.currentPhase];
  const elapsed = Date.now() - bake.phaseStartedAt;
  const remaining = phase.duration - elapsed;
  const progress = Math.max(0, Math.min(1, elapsed / phase.duration));

  const advance = () => {
    if (bake.currentPhase >= phases.length - 1) {
      // Finished — hand off to App to open the review prompt
      onFinishBake(bake);
      return;
    }
    dispatch({
      type: 'ADVANCE_PHASE',
      bake: {
        ...bake,
        completedPhases: [...bake.completedPhases, bake.currentPhase],
        currentPhase: bake.currentPhase + 1,
        phaseStartedAt: Date.now(),
      },
    });
  };

  const toggleFold = (idx) => {
    const folds = bake.folds.map(f => f.index === idx ? { ...f, done: !f.done } : f);
    dispatch({ type: 'UPDATE_BAKE', bake: { ...bake, folds } });
  };

  return h('div', null,
    h('div', { className: 'row-between' },
      h('div', null,
        h('h1', null, recipe.name),
        h('p', { className: 'subtitle' }, `Started ${fmtTime(bake.startedAt)} • Phase ${bake.currentPhase + 1} / ${phases.length}`),
      ),
      h('button', { className: 'btn btn-danger-ghost btn-sm', onClick: () => {
        if (confirm('Cancel this bake?')) {
          dispatch({ type: 'CANCEL_BAKE' });
          toast('Bake cancelled');
        }
      } }, 'Cancel'),
    ),

    // Current phase
    h('div', { className: 'phase-active' },
      h('div', { className: 'badge terracotta', style: { marginBottom: 10 } }, 'Now'),
      h('div', { className: 'phase-name' }, phase.name),
      h('div', { className: 'phase-instr' }, phase.instr),

      h('div', { className: 'timer-display' }, fmtDuration(remaining)),
      h('div', { className: 'timer-target' },
        remaining > 0 ? `of ${fmtDuration(phase.duration)} • finishes ${fmtTime(bake.phaseStartedAt + phase.duration)}` : 'Time\'s up — ready to advance'
      ),

      h('div', { className: 'rise-track', style: { marginTop: 14, marginBottom: 4 } },
        h('div', { className: 'rise-fill', style: { width: `${Math.round(progress * 100)}%`, background: remaining > 0 ? 'linear-gradient(90deg, var(--amber), var(--terracotta))' : 'var(--sage)' } }),
      ),

      // Folds during bulk
      phase.folds && bake.folds.length > 0 && h('div', { style: { marginTop: 14 } },
        h('div', { className: 'field-label', style: { marginBottom: 8 } }, 'Stretch & folds'),
        h('div', null,
          bake.folds.map(f => {
            const due = !f.done && Date.now() >= f.ts - 60000;
            const cls = 'fold-pill' + (f.done ? ' done' : due ? ' due' : '');
            return h('button', {
              key: f.index, className: cls,
              style: { cursor: 'pointer', border: 'none', fontFamily: 'inherit' },
              onClick: () => toggleFold(f.index),
              title: 'Tap to toggle',
            }, `#${f.index} ${fmtTime(f.ts)}`, f.done ? ' ✓' : '');
          }),
        ),
      ),

      h('button', { className: 'btn btn-primary btn-block', style: { marginTop: 18 }, onClick: advance },
        bake.currentPhase >= phases.length - 1 ? 'Finish bake' : 'Advance to next phase',
        h(Icon, { name: 'arrow', size: 16 }),
      ),
    ),

    // Timeline
    h('div', { className: 'card' },
      h('h3', { style: { marginBottom: 4 } }, 'Timeline'),
      h('div', { className: 'phase-list' },
        phases.map((p, i) => {
          const done = bake.completedPhases.includes(i);
          const current = i === bake.currentPhase;
          return h('div', { key: p.key, className: 'phase-item' + (done ? ' done' : '') + (current ? ' current' : '') },
            h('div', { className: 'phase-dot' }),
            h('div', null,
              h('div', { className: 'phase-item-name' }, p.name),
              h('div', { className: 'phase-item-time' }, fmtHoursPretty(p.duration / 3600000)),
            ),
          );
        })
      ),
    ),
  );
}

        ),
      ),
      state.recipes.length > 0 && h('button', { className: 'btn btn-primary btn-sm', onClick: () => setCreating(true) },
        h(Icon, { name: 'plus', size: 16 }), 'New review',

          ),

      : reviews.map(rv => {
          const recipe = state.recipes.find(r => r.id === rv.recipeId);

    editing && h(ReviewModal, {
      state,
      review: editing,
      onClose: () => setEditing(null),

        dispatch({ type: 'UPDATE_REVIEW', review });
        setEditing(null);
        setViewing(review);
        toast('Review updated');

    viewing && h(ReviewDetailModal, {

}

function ReviewModal({ state, review, preselectRecipeId, onClose, onSave }) {
  const [rv, setRv] = useState(review || {
    id: uid(),
    recipeId: preselectRecipeId || (state.recipes[0]?.id || ''),
    bakeDate: Date.now(),
    createdAt: Date.now(),
    rating: 0,
    issues: [],
    notes: '',
  });

  const [bakeDateStr, setBakeDateStr] = useState(() => {
    const d = new Date(rv.bakeDate);
    return d.toISOString().slice(0, 10);
  });

  const set = (k, v) => setRv({ ...rv, [k]: v });
  const toggleIssue = (key) => {
    const has = rv.issues.includes(key);
    set('issues', has ? rv.issues.filter(k => k !== key) : [...rv.issues, key]);
  };

  // group issues by category
  const grouped = Object.keys(ISSUE_CATEGORIES).map(cat => ({
    key: cat,
    label: ISSUE_CATEGORIES[cat],
    issues: REVIEW_ISSUES.filter(i => i.category === cat),

  const submit = (e) => {
    e.preventDefault();
    if (!rv.recipeId) return;
    const [y, m, d] = bakeDateStr.split('-').map(Number);

    onSave({ ...rv, bakeDate: bakeTs, notes: rv.notes.trim() });

  return h(Modal, { title: review ? 'Edit review' : 'How did it turn out?', onClose },
    h('form', { onSubmit: submit },

        h('div', { className: 'field' },

          h('select', {
            className: 'select',
            value: rv.recipeId,
            onChange: e => set('recipeId', e.target.value),
            required: true,
          },
            state.recipes.map(r => h('option', { key: r.id, value: r.id }, r.name)),
          ),
        ),
        h('div', { className: 'field' },
          h('label', { className: 'field-label' }, 'Bake date'),
          h('input', {
            type: 'date', className: 'input',
            value: bakeDateStr,
            max: new Date().toISOString().slice(0, 10),
            onChange: e => setBakeDateStr(e.target.value),
          }),
        ),
        h('div', { className: 'field' },
          h('label', { className: 'field-label' }, 'Rating'),
          h(StarRating, { value: rv.rating, interactive: true, onChange: (v) => set('rating', v), size: 28 }),
        ),
        h('div', { className: 'field' },

// -------------------- Auth modal --------------------
function AuthModal({ onClose, toast }) {
  const [mode, setMode] = useState('signin'); // 'signin' | 'signup' | 'reset'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setSuccess('');
    if (!email.trim()) { setError('Enter your email.'); return; }
    if (mode !== 'reset' && password.length < 6) {
      setError('Password must be at least 6 characters.');
      return;
    }
    setBusy(true);
    try {
      if (mode === 'signin') {
        await authSignIn(email.trim(), password);
        toast('Signed in');
        onClose();
      } else if (mode === 'signup') {
        const result = await authSignUp(email.trim(), password);
        // If email confirmation is enabled, session is null until they confirm
        if (!result.session) {
          setSuccess('Check your email to confirm your account, then sign in.');
          setMode('signin');
        } else {
          toast('Account created');
          onClose();
        }
      } else if (mode === 'reset') {
        await authResetPassword(email.trim());
        setSuccess('Password reset email sent. Check your inbox.');
      }
    } catch (err) {
      setError(err.message || 'Something went wrong. Try again.');
    } finally {
      setBusy(false);
    }
  };

  const title = mode === 'signin' ? 'Sign in to Crumb'
    : mode === 'signup' ? 'Create your Crumb account'
    : 'Reset password';

  return h(Modal, { title, onClose },
    h('form', { onSubmit: submit },
      h('div', { className: 'modal-body' },
        mode !== 'reset' && h('div', { className: 'auth-tabs' },
          h('button', {
            type: 'button',
            className: 'auth-tab' + (mode === 'signin' ? ' active' : ''),
            onClick: () => { setMode('signin'); setError(''); setSuccess(''); },
          }, 'Sign in'),
          h('button', {
            type: 'button',
            className: 'auth-tab' + (mode === 'signup' ? ' active' : ''),
            onClick: () => { setMode('signup'); setError(''); setSuccess(''); },
          }, 'Create account'),
        ),
        error && h('div', { className: 'auth-error' }, error),
        success && h('div', { className: 'auth-success' }, success),
        !supabaseClient && h('div', { className: 'auth-error' },
          "Sign-in isn't configured yet. Open supabase-setup.md for setup instructions."
        ),
        h('div', { className: 'field' },
          h('label', { className: 'field-label' }, 'Email'),
          h('input', {
            type: 'email', className: 'input',
            value: email,
            onChange: e => setEmail(e.target.value),
            placeholder: 'you@example.com',
            required: true, autoFocus: true,
            disabled: !supabaseClient,
          }),
        ),
        mode !== 'reset' && h('div', { className: 'field' },
          h('label', { className: 'field-label' }, 'Password'),
          h('input', {
            type: 'password', className: 'input',
            value: password,
            onChange: e => setPassword(e.target.value),
            placeholder: 'At least 6 characters',
            required: true, minLength: 6,
            disabled: !supabaseClient,
          }),
        ),
        mode === 'signin' && h('div', { className: 'auth-help' },
          h('a', { onClick: () => { setMode('reset'); setError(''); setSuccess(''); } }, 'Forgot password?'),
        ),
        mode === 'reset' && h('div', { className: 'auth-help' },
          h('a', { onClick: () => { setMode('signin'); setError(''); setSuccess(''); } }, '← Back to sign in'),
        ),
        mode === 'signup' && h('div', { className: 'auth-help' },
          "Signing up syncs your existing recipes, starters, and reviews to your account so they appear on any device."
        ),
      ),
      h('div', { className: 'modal-footer' },
        h('button', { type: 'button', className: 'btn', onClick: onClose }, 'Cancel'),
        h('button', {
          type: 'submit', className: 'btn btn-primary',
          disabled: busy || !supabaseClient,
        },
          busy ? 'Working…'
            : mode === 'signin' ? 'Sign in'
            : mode === 'signup' ? 'Create account'
            : 'Send reset email'
        ),
      ),
    ),
  );
}

// -------------------- Modal wrapper --------------------
function Modal({ title, onClose, children }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [onClose]);

  return h('div', { className: 'modal-backdrop', onClick: (e) => { if (e.target === e.currentTarget) onClose(); } },
    h('div', { className: 'modal' },
      h('div', { className: 'modal-header' },
        h('h3', { style: { fontFamily: 'Fraunces, serif', fontSize: 20 } }, title),
        h('button', { className: 'icon-btn', onClick: onClose, 'aria-label': 'Close' }, h(Icon, { name: 'close', size: 16 })),
      ),
      children,
    ),
  );
}

// ============================================================
//  Notification scheduler
// ============================================================
function useNotificationScheduler(state) {
  const fired = useRef(new Set());
  useEffect(() => {
    if (!state.notificationsEnabled) return;
    const interval = setInterval(() => {
      const now = Date.now();

      // Active bake — phase finishing
      if (state.activeBake) {
        const recipe = state.recipes.find(r => r.id === state.activeBake.recipeId);
        if (recipe) {
          const phases = bakePhases(recipe);
          const phase = phases[state.activeBake.currentPhase];
          const finishesAt = state.activeBake.phaseStartedAt + phase.duration;
          const key = `phase-${state.activeBake.id}-${state.activeBake.currentPhase}`;
          if (now >= finishesAt && !fired.current.has(key)) {
            fired.current.add(key);
            showNotification('Crumb', `${phase.name} is done — time for the next step.`);
          }
          // Folds
          state.activeBake.folds?.forEach(f => {
            const fkey = `fold-${state.activeBake.id}-${f.index}`;
            if (!f.done && now >= f.ts && !fired.current.has(fkey)) {
              fired.current.add(fkey);
              showNotification('Crumb', `Stretch & fold #${f.index} time.`);
            }
          });
        }
      }

      // Starter peak windows — one for each starter (skip idle)
      state.starters.forEach(s => {
        if (s.idle) return;
        const last = s.feedings[0];
        if (!last) return;
        // Match the post-wake sluggishness from starterStatus()
        const postWakeFeedings = s.wokeAt ? s.feedings.filter(f => f.ts >= s.wokeAt).length : Infinity;
        const wakeMultiplier = postWakeFeedings <= 1 ? 1.5
          : postWakeFeedings === 2 ? 1.2
          : 1.0;
        const peakH = predictPeakHours(last.ratio, last.tempC ?? s.ambientTempC) * wakeMultiplier;
        const peakTs = last.ts + peakH * 3600000;
        const peakKey = `peak-${s.id}-${last.id}`;
        if (now >= peakTs && now < peakTs + 60000 && !fired.current.has(peakKey)) {
          fired.current.add(peakKey);
          showNotification('Crumb', `${s.name} should be at its peak — ready to use.`);
        }
        const hungryTs = last.ts + 14 * wakeMultiplier * 3600000;
        const hungryKey = `hungry-${s.id}-${last.id}`;
        if (now >= hungryTs && now < hungryTs + 60000 && !fired.current.has(hungryKey)) {
          fired.current.add(hungryKey);
          showNotification('Crumb', `${s.name} is getting hungry — feed it soon.`);
        }
      });
    }, 30000); // check every 30s

    return () => clearInterval(interval);
  }, [state.notificationsEnabled, state.activeBake, state.starters, state.recipes]);
}

// ============================================================
//  App
// ============================================================
function App() {
  const [state, dispatch] = useReducer(reducer, null, () => {
    const loaded = loadState();
    if (!loaded) return defaultState;
    const merged = { ...defaultState, ...loaded, ui: { ...defaultState.ui, ...(loaded.ui || {}) } };

    // Migrate single starter -> starters array
    if (loaded.starter && !Array.isArray(loaded.starters)) {
      const earliestFeeding = loaded.starter.feedings?.length
        ? Math.min(...loaded.starter.feedings.map(f => f.ts))
        : Date.now();
      const migratedStarter = {
        id: DEFAULT_STARTER_ID,
        createdAt: earliestFeeding,
        ...loaded.starter,
      };
      merged.starters = [migratedStarter];
      merged.activeStarterId = DEFAULT_STARTER_ID;
      delete merged.starter;
    }
    // Ensure every starter has an id + createdAt + idle fields
    if (Array.isArray(merged.starters)) {
      merged.starters = merged.starters.map(s => ({
        ...s,
        id: s.id || uid(),
        createdAt: s.createdAt || (s.feedings?.length ? Math.min(...s.feedings.map(f => f.ts)) : Date.now()),
        feedings: s.feedings || [],
        idle: s.idle === true,
        idleStartedAt: s.idleStartedAt || null,
        idleSuggestionDismissedAt: s.idleSuggestionDismissedAt || null,
        wokeAt: s.wokeAt || null,
      }));
      if (!merged.starters.find(s => s.id === merged.activeStarterId)) {
        merged.activeStarterId = merged.starters[0]?.id || DEFAULT_STARTER_ID;
      }
    }

    // Migrate old recipes: rename levain -> starter, ensure extras array,
    // convert flourTotal -> flours array, rename old sample-country id to lib-country
    if (Array.isArray(merged.recipes)) {
      const seenIds = new Set();
      merged.recipes = merged.recipes.map(r => {
        const out = { ...r, extras: r.extras || [] };
        if (out.starter === undefined && out.levain !== undefined) {
          out.starter = out.levain;
        }
        delete out.levain;
        // Convert flourTotal -> flours
        if (!Array.isArray(out.flours)) {
          out.flours = [{ id: uid(), name: 'Bread flour', grams: Number(out.flourTotal) || 500 }];
        }
        delete out.flourTotal;
        if (out.id === 'sample-country' && !merged.recipes.find(x => x.id === 'lib-country')) {
          out.id = 'lib-country';
        }
        while (seenIds.has(out.id)) out.id = uid();
        seenIds.add(out.id);
        return out;
      });
    }

    // Ensure reviews array exists
    if (!Array.isArray(merged.reviews)) merged.reviews = [];

    // One-time auto-merge of recipe library for users on older versions
    if (!loaded.libraryMerged) {
      const have = new Set((merged.recipes || []).map(r => r.id));
      const toAdd = RECIPE_LIBRARY
        .filter(r => !have.has(r.id))
        .map(r => ({ ...r, extras: r.extras.map(x => ({ ...x })) }));
      merged.recipes = [...(merged.recipes || []), ...toAdd];
      merged.libraryMerged = true;
    }
    return merged;
  });
  const [toastMsg, setToastMsg] = useState(null);
  const toast = useCallback((msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 2200);
  }, []);

  // Persist on changes
  useEffect(() => { saveState(state); }, [state]);

  // Tick for live timers (Today + Starter use Date.now in memoization)
  const [, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 30000);
    return () => clearInterval(id);
  }, []);

  useNotificationScheduler(state);

  const setTab = (tab) => dispatch({ type: 'SET_TAB', tab });

  const [pendingReview, setPendingReview] = useState(null);
  const onFinishBake = (bake) => {
    dispatch({ type: 'CANCEL_BAKE' });
    toast('Bake complete — enjoy your loaf!');
    setPendingReview({ recipeId: bake.recipeId });
  };

  const enableNotifs = async () => {
    const ok = await requestNotificationPermission();
    dispatch({ type: 'SET_NOTIFICATIONS', enabled: ok });
    if (ok) {
      toast('Notifications on');
      showNotification('Crumb', 'You\'ll be reminded when it matters.');
    } else {
      toast('Notifications blocked');
    }
  };

  // ===== Auth + cloud sync =====
  const [authUser, setAuthUser] = useState(null);
  const [showAuth, setShowAuth] = useState(false);
  const [pendingMerge, setPendingMerge] = useState(null); // { cloud, local }
  const [mergeBusy, setMergeBusy] = useState(false);
  const cloudReady = useRef(false);

  // Subscribe to auth session changes
  useEffect(() => {
    if (!supabaseClient) return;
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setAuthUser(session?.user || null);
    });
    const { data } = supabaseClient.auth.onAuthStateChange((event, session) => {
      setAuthUser(session?.user || null);
      if (event === 'SIGNED_OUT') {
        cloudReady.current = false;
      }
    });
    return () => data?.subscription?.unsubscribe?.();
  }, []);

  // On sign-in: reconcile cloud vs local
  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; });

  useEffect(() => {
    if (!authUser || !supabaseClient) {
      cloudReady.current = false;
      return;
    }
    let cancelled = false;
    (async () => {
      const cloud = await fetchCloudData(authUser.id);
      if (cancelled) return;
      const localMeaningful = hasLocalData(stateRef.current);
      if (cloud && localMeaningful) {
        setPendingMerge({ cloud, local: stateRef.current });
      } else if (cloud) {
        dispatch({ type: 'HYDRATE', state: cloud });
        cloudReady.current = true;
      } else {
        await pushCloudData(authUser.id, stateRef.current);
        cloudReady.current = true;
      }
    })();
    return () => { cancelled = true; };
  }, [authUser?.id]);

  // Debounced push of state changes to cloud
  useEffect(() => {
    if (!authUser || !supabaseClient || !cloudReady.current) return;
    const t = setTimeout(() => {
      pushCloudData(authUser.id, state);
    }, 1500);
    return () => clearTimeout(t);
  }, [state, authUser?.id]);

  const resolveMerge = async (choice) => {
    if (!pendingMerge || !authUser) return;
    setMergeBusy(true);
    try {
      if (choice === 'cloud') {
        dispatch({ type: 'HYDRATE', state: pendingMerge.cloud });
        cloudReady.current = true;
        toast('Loaded data from your account');
      } else if (choice === 'local') {
        await pushCloudData(authUser.id, pendingMerge.local);
        cloudReady.current = true;
        toast('This device\'s data uploaded');
      } else if (choice === 'signout') {
        await authSignOut();
      }
    } finally {
      setMergeBusy(false);
      setPendingMerge(null);
    }
  };

  const signOut = async () => {
    await authSignOut();
    toast('Signed out');
  };

  const tab = state.ui.tab;

  return h(React.Fragment, null,
    h(Header, {
      tab, setTab,
      authUser,
      onOpenAuth: () => setShowAuth(true),
      onSignOut: signOut,
    }),
    h('main', null,
      h(NotifBanner, { enabled: state.notificationsEnabled, onEnable: enableNotifs }),
      tab === 'today' && h(TodayTab, { state, dispatch, setTab, toast }),
      tab === 'starter' && h(StarterTab, { state, dispatch, toast }),
      tab === 'recipes' && h(RecipesTab, { state, dispatch, toast, setTab }),
      tab === 'bake' && h(BakeTab, { state, dispatch, toast, onFinishBake }),
      tab === 'reviews' && h(ReviewsTab, { state, dispatch, toast }),
    ),
    pendingReview && h(ReviewModal, {
      state,
      preselectRecipeId: pendingReview.recipeId,
      onClose: () => setPendingReview(null),
      onSave: (review) => {
        dispatch({ type: 'ADD_REVIEW', review });
        setPendingReview(null);
        toast('Review saved');
      },
    }),
    showAuth && h(AuthModal, {
      onClose: () => setShowAuth(false),
      toast,
    }),
    pendingMerge && h(MergeChoiceModal, {
      onChoose: resolveMerge,
      busy: mergeBusy,
    }),
    toastMsg && h('div', { className: 'toast' }, toastMsg),
  );
}

const root = createRoot(document.getElementById('root'));
root.render(h(App));

// Register a tiny inline service worker so the app is installable + works offline
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'crumb-v1';
    self.addEventListener('install', e => {
      e.waitUntil(self.skipWaiting());
    });
    self.addEventListener('activate', e => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', e => {
      const req = e.request;
      if (req.method !== 'GET') return;
      e.respondWith(
        caches.open(CACHE).then(async cache => {
          const cached = await cache.match(req);
          const fetchPromise = fetch(req).then(resp => {
            if (resp.ok) cache.put(req, resp.clone());
            return resp;
          }).catch(() => cached);
          return cached || fetchPromise;
        })
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(() => {/* file:// will refuse — that's fine */});
}
})();
